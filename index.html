<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="新知雷達">
<title>Bernard 的新知雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F4F0;
    --card: #FDFCFA;
    --soft: #F2F0EA;
    --text: #3A3A3A;
    --text-soft: #6B6862;
    --line: #E5E2DB;
    --terracotta: #C47C6A;
    --sage: #7A9E87;
    --dustyblue: #7A94A8;
    --caramel: #C9964A;
    --lavender: #A18FB8;
    --rose: #C08A95;
    --teal: #6E9E9A;
    --olive: #9AA06B;
    --plum: #98768F;
    --slate: #8A8FA8;
    --walnut: #A5825F;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(90, 85, 75, 0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', 'Noto Sans TC', -apple-system, sans-serif;
    font-weight: 400; line-height: 1.65;
    padding-bottom: 80px; -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 1080px; margin: 0 auto;
    padding: 0 max(24px, env(safe-area-inset-left)) 0 max(24px, env(safe-area-inset-right));
  }

  /* ---------- header ---------- */
  header { padding: 56px 0 8px; }
  .eyebrow { font-size: 13px; letter-spacing: 3px; color: var(--terracotta); text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-family: 'DM Serif Display', 'Noto Serif TC', serif; font-size: clamp(30px, 5vw, 44px); font-weight: 700; line-height: 1.25; }
  h1 .accent { color: var(--sage); }
  .subtitle { color: var(--text-soft); margin-top: 12px; max-width: 640px; font-weight: 300; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10; margin: 26px 0 6px; padding: 10px 0;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .search {
    width: 100%; max-width: 420px; font-family: inherit; font-size: 15px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 16px; margin-bottom: 8px; min-height: 38px;
  }
  .search:focus { outline: 2px solid color-mix(in srgb, var(--sage) 50%, white); outline-offset: 1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 15px; font-size: 14px; cursor: pointer; color: var(--text-soft);
    font-family: inherit; transition: all .18s ease; min-height: 36px; touch-action: manipulation;
    white-space: nowrap;
  }
  .chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .chip.active { color: #fff; border-color: transparent; }

  /* ---------- sections ---------- */
  section { margin-top: 48px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
  h2 { font-family: 'DM Serif Display', 'Noto Serif TC', serif; font-size: 26px; font-weight: 700; }
  .sec-note { color: var(--text-soft); font-size: 14px; font-weight: 300; }
  .sec-bar { width: 46px; height: 4px; border-radius: 2px; margin: 10px 0 20px; }
  .subsec { margin-top: 26px; }
  .subsec > h3 { font-size: 17px; font-weight: 700; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .subsec > h3 small { font-size: 13px; color: var(--text-soft); font-weight: 300; }
  .issue-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--text-soft); }
  .badge { background: var(--lavender); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 13px; flex: none; }
  .empty { color: var(--text-soft); font-size: 14px; font-weight: 300; }
  .legacy-note { font-size: 13px; color: var(--text-soft); background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0 14px; }

  /* ---------- item cards ---------- */
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .items.big { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative;
  }
  .item.big { border-top: 5px solid var(--dc, var(--terracotta)); }
  .item.big h4 { font-size: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; padding-right: 30px; }
  .tag { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; color: #fff; }
  .etag { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; color: var(--text-soft); background: var(--soft); border: 1px solid var(--line); }
  .etag.ext { border-style: dashed; }
  .item h4 { font-size: 15.5px; font-weight: 700; line-height: 1.45; }
  .item .lead { font-size: 14px; color: var(--text); margin: 6px 0 4px; }
  .item p.sum { font-size: 13.5px; color: var(--text-soft); margin: 6px 0 10px; }
  .item p.sum.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .detail { display: none; margin-top: 8px; }
  .item.expanded .detail { display: block; }
  .f { margin-top: 10px; }
  .f b { display: block; font-size: 12.5px; color: var(--sage); font-weight: 500; letter-spacing: .5px; }
  .f p { font-size: 13.5px; color: var(--text-soft); margin-top: 2px; white-space: pre-line; }
  .dates { font-size: 12px; color: var(--text-soft); margin-top: 10px; }
  .verdict-in { margin-top: 10px; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .more {
    background: none; border: none; cursor: pointer; font-family: inherit; color: var(--dustyblue);
    font-size: 12.5px; padding: 8px 0 0; text-align: left; touch-action: manipulation; align-self: flex-start;
  }
  .more:hover { color: var(--terracotta); }
  .item .use { margin-top: auto; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .item .use b { color: var(--sage); font-weight: 500; }
  .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { font-size: 12.5px; color: var(--dustyblue); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--dustyblue) 40%, white); }
  .links a:hover { color: var(--terracotta); }
  .star {
    background: none; border: none; cursor: pointer; font-size: 19px; color: #C9C5BB; line-height: 1;
    position: absolute; top: 8px; right: 8px; padding: 8px; touch-action: manipulation;
  }
  .star.on { color: var(--caramel); }
  .lv { display: inline-block; font-size: 11.5px; color: #fff; border-radius: 999px; padding: 2px 10px; margin-right: 8px; vertical-align: 1px; }

  /* ---------- deep dive ---------- */
  .deep { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--teal); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
  .deep h4 { font-family: 'DM Serif Display', 'Noto Serif TC', serif; font-size: 20px; margin: 4px 0 6px; }
  .deep .body p { font-size: 14px; color: var(--text); margin-top: 10px; }
  .deep .body.clamped { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }

  /* ---------- brief list ---------- */
  .brief-list { list-style: none; display: grid; gap: 10px; }
  .brief { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 44px 12px 14px; position: relative; }
  .brief-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
  .brief b { font-size: 14.5px; }
  .brief p { font-size: 13.5px; color: var(--text-soft); }
  .brief .lim { font-size: 12.5px; margin-top: 3px; }
  .acc { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--caramel) 16%, white); border: 1px solid color-mix(in srgb, var(--caramel) 35%, white); }
  .dl { font-size: 12px; color: var(--rose); font-weight: 500; }
  .brief .star { top: 4px; right: 4px; }

  /* ---------- tracking ---------- */
  .upd { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--terracotta); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .upd b { font-size: 14.5px; }
  .upd p { font-size: 13.5px; color: var(--text-soft); margin-top: 3px; }

  /* ---------- notes ---------- */
  .note { margin-top: 26px; font-size: 13px; color: var(--text-soft); border-left: 3px solid var(--lavender); padding: 2px 0 2px 12px; }
  .note p + p { margin-top: 6px; }
  .note b { color: var(--text); font-weight: 500; }
  .corr { margin-top: 14px; font-size: 13px; color: var(--text-soft); background: color-mix(in srgb, var(--rose) 10%, white); border-radius: 8px; padding: 8px 12px; }

  /* ---------- legacy analysis ---------- */
  .analysis { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px 14px; margin-top: 14px; border-top: 5px solid var(--lavender); }
  .analysis h4 { font-family: 'DM Serif Display', 'Noto Serif TC', serif; font-size: 19px; }
  .analysis .topline { font-size: 14px; color: var(--text-soft); margin: 6px 0 4px; }
  .verdict { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .verdict:last-of-type { border-bottom: none; }
  .verdict b { font-size: 14.5px; }
  .verdict p { font-size: 13.5px; color: var(--text-soft); margin-top: 4px; }
  .verdict .practice { margin-top: 7px; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 7px 10px; }
  .verdict .practice b { color: var(--caramel); font-weight: 500; font-size: 13px; }
  .analysis .meta-note { margin: 12px 0 6px; font-size: 13px; color: var(--text-soft); border-left: 3px solid var(--lavender); padding-left: 10px; }

  /* ---------- archive ---------- */
  .report { margin-bottom: 14px; }
  .report-head {
    display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; cursor: pointer;
    font-family: inherit; padding: 8px 0; font-size: 14px; color: var(--text-soft); text-align: left; touch-action: manipulation; flex-wrap: wrap;
  }
  .report-head .caret { font-size: 11px; flex: none; transition: transform .18s ease; }
  .report.open .report-head .caret { transform: rotate(90deg); }
  .report-body { display: none; padding: 4px 0 18px; }
  .report.open .report-body { display: block; }
  .result-group { margin-bottom: 22px; }
  .result-group > p { font-size: 13px; color: var(--text-soft); margin-bottom: 8px; }

  /* ---------- saved ---------- */
  #savedList { list-style: none; }
  #savedList li {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  #savedList .rm { background: none; border: none; color: var(--rose); cursor: pointer; font-size: 14px; padding: 8px; margin: -8px; touch-action: manipulation; }

  /* ---------- watchlist ---------- */
  details.watch { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; margin-bottom: 10px; }
  details.watch summary { cursor: pointer; padding: 12px 0; font-weight: 500; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; list-style: none; }
  details.watch summary::-webkit-details-marker { display: none; }
  details.watch summary::before { content: '▶'; font-size: 10px; color: var(--text-soft); transition: transform .18s ease; }
  details.watch[open] summary::before { transform: rotate(90deg); }
  details.watch summary .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  details.watch summary small { color: var(--text-soft); font-weight: 300; font-size: 12.5px; }
  .watch-body { padding: 0 0 14px; font-size: 13.5px; color: var(--text-soft); }
  .watch-body ul { list-style: none; margin-top: 6px; }
  .watch-body li { padding: 4px 0 4px 14px; position: relative; border-bottom: 1px dashed var(--line); }
  .watch-body li:last-child { border-bottom: none; }
  .watch-body li::before { content: ''; position: absolute; left: 2px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--dc); }
  .rules { font-size: 13.5px; color: var(--text-soft); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
  .rules li { margin: 4px 0 4px 18px; }

  footer { margin-top: 64px; text-align: center; color: var(--text-soft); font-size: 12.5px; font-weight: 300; }

  @media (hover: none) { .chip:hover { transform: none; box-shadow: none; } }
  @media (max-width: 640px) {
    header { padding: 32px 0 4px; }
    .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    section { margin-top: 36px; }
    h2 { font-size: 22px; }
    .sec-head { flex-direction: column; gap: 2px; }
    .search { max-width: 100%; }
    .filters { gap: 6px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 12px; font-size: 13px; flex: none; }
    .item { padding: 16px 14px; }
    .items, .items.big { gap: 12px; }
    .deep { padding: 16px; }
    body { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Interest &amp; Work Radar</div>
    <h1>Bernard 的 <span class="accent">新知雷達</span></h1>
    <p class="subtitle">以你的興趣與工作項目為核心，每週整理重要更新、新發佈與值得理解的新知。AI 是其中一個領域，其他領域不必與 AI 有關。</p>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="搜尋所有期數：標題、內容、品牌…" aria-label="搜尋所有期數">
    <div class="filters" id="filterBar"></div>
  </div>

  <section id="results" hidden>
    <div class="sec-head"><h2>搜尋結果</h2><span class="sec-note" id="resultNote"></span></div>
    <div class="sec-bar" style="background:var(--dustyblue)"></div>
    <div id="resultList"></div>
  </section>

  <section id="latest">
    <div class="sec-head"><h2>本期</h2><span class="issue-meta" id="latestMeta"></span></div>
    <div class="sec-bar" style="background:var(--terracotta)"></div>
    <div id="latestBody"></div>
  </section>

  <section id="archive">
    <div class="sec-head"><h2>舊期</h2><span class="sec-note">依日期收合；上方搜尋框可跨期查找</span></div>
    <div class="sec-bar" style="background:var(--lavender)"></div>
    <div id="archiveList"></div>
  </section>

  <section id="saved">
    <div class="sec-head"><h2>收藏</h2><span class="sec-note">點 ☆ 收藏，存在這台裝置的瀏覽器裡</span></div>
    <div class="sec-bar" style="background:var(--caramel)"></div>
    <ul id="savedList"></ul>
  </section>

  <section id="watch">
    <div class="sec-head"><h2>選材規則與關注名單</h2><span class="sec-note">每週搜尋依這份名單出發</span></div>
    <div class="sec-bar" style="background:var(--sage)"></div>
    <div class="rules" id="rulesBox"></div>
    <div id="watchList"></div>
  </section>

  <footer>每週四由 Claude 排程自動更新 · 2026-09-14 起由「AI 應用雷達」改版為新知雷達，舊期保留原格式</footer>
</div>

<!-- ==================== 設定：領域、事件標籤、關注名單 ==================== -->
<script type="application/json" id="radar-config">
{
  "version": "2026-09-14",
  "rules": [
    "重要性與行動分開判斷：重大消息即使暫時用不上也可進「本週值得知道」；限時資源再急也不佔頭條。",
    "頭條 1 到 3 則，頭條加主文每期最多 10 則，是上限不是配額，寧缺勿濫。",
    "每則主文寫足五項：發生什麼、為何值得知道、跟你的關係、未確認與限制、來源與日期。",
    "器材與工具類附採用判定（值得主動投入／挑場景試／被動受益／可略過）；歌曲、書籍、賽事、研究只說明為何值得看。",
    "廠商自述不寫成實測結論；效能與價格註明比較條件；事件、發表、截止、查核日期分開標。",
    "沒有新事件的知識文章標「延伸閱讀」，不包裝成當週新聞。",
    "健康條目寫清楚原本怎麼說、新證據是什麼、修正了哪部分、適用哪些人；一篇反向研究不標成翻案。",
    "得獎沖煮法註明比賽用的豆子、水與器材條件。免費插件分清永久免費、限時領取、訂閱內可用與試用。",
    "閱讀不自動產生待辦；只有你明確要求追蹤的事件才進追蹤清單。"
  ],
  "domains": [
    {
      "key": "ai", "name": "AI 與數位工作", "color": "var(--plum)", "freq": "每週核心",
      "scope": "Anthropic、OpenAI、Google 等公司的模型、產品與功能更新；方案、額度、定價與可靠性變動；桌面代理、文件與簡報工具。重點是能否完成實務、會改變哪些限制，不只是模型排名。",
      "watch": ["Anthropic：Claude、Claude Code、方案與額度", "OpenAI：ChatGPT、Codex、方案與額度", "Google：Gemini、Google Workspace", "Apple 與 Microsoft 的系統層 AI 功能", "你在用的平台之間的整合與相容性"]
    },
    {
      "key": "instrument", "name": "樂器", "color": "var(--terracotta)", "freq": "每週核心",
      "scope": "吉他、Bass、效果器、鍵盤、鍵盤音色與音源的新品、韌體與重大新知。例子：TONEX Board 這類整合型新品。",
      "watch": ["IK Multimedia：TONEX 系列（含 Tone Model 生態）", "Line 6：HX 系列", "Strymon、Meris、Walrus Audio", "Morningstar（MIDI 控制器）", "Gretsch、Fender、Lindy Fralin", "鍵盤：Nord、Yamaha、Roland、Korg 舞台鍵盤（待你指定）", "音源：Spectrasonics Omnisphere 與鍵盤音色包", "Bass：主要品牌新品（待你指定）"]
    },
    {
      "key": "pa", "name": "PA 系統", "color": "var(--dustyblue)", "freq": "每週核心",
      "scope": "控台、擴充卡、stage box、喇叭、DI 與訊號盒、IEM、網路音訊、量測與校正。例子：WING MADI Card 這類既有系統的擴充路徑。",
      "watch": ["Behringer 與 Midas：WING 全系列、擴充卡、stage box、韌體", "Allen & Heath、Yamaha、Soundcraft、DiGiCo 等控台", "Waves：SoundGrid 伺服器、授權模式", "網路音訊：Dante、AVB 與 Milan、AES67", "監聽與無線：Shure、Sennheiser、MIPRO、Behringer P16", "介面：Universal Audio（Apollo、Volt）、RME", "喇叭：Genelec 與主要 PA 喇叭品牌", "DI：Radial", "量測與校正：Smaart、Sonarworks SoundID"]
    },
    {
      "key": "plugin", "name": "插件", "color": "var(--caramel)", "freq": "每週，放在短訊",
      "scope": "免費與限免插件，以及授權、訂閱、舊用戶升級權益的變動。你已在用的品牌優先。",
      "watch": ["Universal Audio（UAD 原生插件、Spark）", "Plugin Alliance", "Waves", "其次：Bedroom Producers Blog、Plugin Boutique 的免費動態"]
    },
    {
      "key": "production", "name": "錄音製作與直播投影", "color": "var(--teal)", "freq": "常態",
      "scope": "錄音、混音、現場播放、直播與投影軟體的重大功能、整合或必要修正；分軌分離、採譜、音訊處理的新能力。",
      "watch": ["Apple：Logic Pro、MainStage", "Renewed Vision：ProPresenter", "OBS Studio", "分軌播放：MultiTracks、Loop Community", "分軌分離與和弦採譜工具"]
    },

        "body": "過去對生酮與 168 的主流說法是：減重效果主要來自少吃，飲食型態本身的額外好處有限。今年兩篇研究沒有推翻這個骨架，但各自補上一塊。\n\n第一篇是華盛頓大學醫學院 8 月底發表在 Cell Metabolism 的試驗。42 位有肥胖、前期糖尿病與脂肪肝的受試者，分成生酮、地中海、植物性低脂三組，吃四到五個月。三組體重都掉了約一成，但肝臟脂肪降幅不同：生酮組 67%，另外兩組 45%。\n\n生酮組約一半的人脫離前期糖尿病，地中海組是 29%，植物性低脂組是 7%。生酮組吃的脂肪最多，血脂與膽固醇卻沒有上升。\n\n它修正的是「體重掉一樣多，效果就一樣」這個假設。在同樣減重一成的前提下，肝臟脂肪與血糖指標出現差別。適用範圍要注意：受試者都已有脂肪肝與前期糖尿病，只有 42 人，時間不到半年。\n\n第二篇是西班牙格拉納達大學 7 月發表在 Clinical Nutrition 的試驗。99 位過重或肥胖的成人先全部接受地中海飲食衛教，再分成四組：進食窗 12 小時以上的對照組、早段 8 小時、晚段 8 小時、自選 8 小時。介入 12 週，之後追蹤一年。\n\n一年後，早段與晚段兩組保住的減重都明顯多於對照組，兩者效果相近。整個計畫裡，限時進食的人平均比單純接受飲食衛教的人多減 3 到 4 公斤，約三分之一的人在計畫結束後自己繼續做。\n\n它回應的是「168 一定要早吃才有效」的說法，這個試驗裡早晚兩種時段都有效。新聞稿沒有說明各組熱量是否相同，所以還分不出效果來自時段本身還是吃得比較少。\n\n跟你的關係：你已從減脂期轉入增肌減脂，重點是保住肌肉。這兩篇的受試者都是過重或肥胖、以減重為目標，不能直接套用。可以帶走的是兩點：168 的時段可以配合晨跑與訓練時間彈性安排；生酮對肝臟與血糖的好處，證據集中在已有代謝問題的人。\n\n限制：兩篇的細節都出自新聞稿整理，這次沒有讀原始論文全文。",

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

let CFG, TRACK, REPORTS;
try {
  CFG = JSON.parse(document.getElementById('radar-config').textContent);
  TRACK = JSON.parse(document.getElementById('tracking-data').textContent).items || [];
  REPORTS = JSON.parse(document.getElementById('weekly-reports').textContent).reports || [];
} catch (e) {
  const err = document.createElement('p');
  err.style.cssText = 'margin:40px auto;max-width:600px;padding:16px 20px;background:#F7E8E4;border:1px solid #DDB3A8;border-radius:10px;font-size:14px;color:#8A4A3A';
  err.textContent = '資料區塊解析失敗（JSON 格式錯誤），頁面暫時無法顯示內容。請 Claude 檢查 ai-radar.html 的資料區塊：' + e.message;
  document.querySelector('.wrap').prepend(err);
  throw e;
}

const DOMAINS = CFG.domains;
const dmap = Object.fromEntries(DOMAINS.map(d => [d.key, d]));
const TAGS = CFG.tags || {};
const ACCESS = CFG.access || {};
const LEGACY = CFG.legacy || { map: {}, names: {} };
const LV = {
  invest: { t: '值得主動投入', c: 'var(--sage)' },
  try: { t: '挑場景試', c: 'var(--caramel)' },
  passive: { t: '被動受益', c: 'var(--dustyblue)' },
  skip: { t: '可略過', c: 'var(--rose)' }
};

let filter = 'all';
let query = '';
const openWeeks = new Set();
let saved = [];
try { saved = JSON.parse(localStorage.getItem('aiRadarSaved') || '[]'); } catch (e) { saved = []; }
const persist = () => { try { localStorage.setItem('aiRadarSaved', JSON.stringify(saved)); } catch (e) {} };

/* ---------- 共用判斷 ---------- */
const isV2 = r => (r.schema || 1) >= 2;
function itemDomains(it, r) {
  if (isV2(r)) return [it.domain, ...(it.also || [])];
  return (it.domains || []).flatMap(k => LEGACY.map[k] || []);
}
const passFilter = (it, r) => filter === 'all' || itemDomains(it, r).includes(filter);
function itemText(it) {
  return [it.title, it.lead, it.what, it.why, it.relation, it.limits, it.summary, it.use,
    (it.verdict || {}).practice].join(' ').toLowerCase();
}
const passQuery = it => !query || itemText(it).includes(query);
const issueNo = r => REPORTS.length - REPORTS.indexOf(r);

/* ---------- 小元件 ---------- */
function domainTag(k) {
  const d = dmap[k];
  return d ? `<span class="tag" style="background:${d.color}">${esc(d.name)}</span>` : '';
}
const legacyTag = k => `<span class="tag" style="background:var(--slate)">${esc(LEGACY.names[k] || k)}</span>`;
const starBtn = id => {
  const on = saved.includes(id);
  return `<button class="star ${on ? 'on' : ''}" data-star="${esc(id)}" title="收藏">${on ? '★' : '☆'}</button>`;
};
const linksHtml = ls => `<div class="links">${(ls || []).map(l => `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>`;
const field = (label, text) => text ? `<div class="f"><b>${label}</b><p>${esc(text)}</p></div>` : '';

function datesLine(d) {
  d = d || {};
  const parts = [['事件', d.event], ['發表', d.published], ['截止', d.deadline], ['查核', d.checked]]
    .filter(x => x[1]).map(x => `${x[0]} ${esc(x[1])}`);
  return parts.length ? `<p class="dates">${parts.join(' · ')}</p>` : '';
}

/* ---------- 新格式卡片 ---------- */
function v2Card(it, big) {
  const d = dmap[it.domain] || {};
  const tags = [domainTag(it.domain), ...(it.also || []).map(domainTag),
    ...(it.tags || []).map(t => `<span class="etag">${esc((TAGS[t] || {}).name || t)}</span>`),
    it.extended ? '<span class="etag ext">延伸閱讀</span>' : ''].join('');
  const v = it.verdict && LV[it.verdict.level]
    ? `<div class="verdict-in"><span class="lv" style="background:${LV[it.verdict.level].c}">${LV[it.verdict.level].t}</span>${esc(it.verdict.practice || '')}</div>` : '';
  return `<article class="item${big ? ' big' : ''}" style="--dc:${d.color || 'var(--terracotta)'}">
    ${starBtn(it.title)}
    <div class="tags">${tags}</div>
    <h4>${esc(it.title)}</h4>
    <p class="lead">${esc(it.lead)}</p>
    <div class="detail">
      ${field('發生什麼', it.what)}${field('為何值得知道', it.why)}${field('跟你的關係', it.relation)}${field('未確認與限制', it.limits)}
      ${v}${datesLine(it.dates)}
    </div>
    <button class="more" data-toggle>展開全文 ▾</button>
    ${linksHtml(it.links)}
  </article>`;
}

function briefRow(it) {
  const acc = it.access ? `<span class="acc">${esc(ACCESS[it.access] || it.access)}</span>` : '';
  const dl = it.dates && it.dates.deadline ? `<span class="dl">期限 ${esc(it.dates.deadline)}</span>` : '';
  return `<li class="brief">${starBtn(it.title)}
    <div class="brief-head">${domainTag(it.domain)}${acc}${dl}</div>
    <b>${esc(it.title)}</b>
    <p>${esc(it.lead)}</p>
    ${it.limits ? `<p class="lim">條件與限制：${esc(it.limits)}</p>` : ''}
    ${linksHtml(it.links)}
  </li>`;
}

function deepBlock(dp) {
  const paras = String(dp.body || '').split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('');
  return `<div class="deep">
    <div class="tags">${domainTag(dp.domain)}</div>
    <h4>${esc(dp.title)}</h4>
    <div class="body clamped">${paras}</div>
    <button class="more" data-deep>展開全文 ▾</button>
    ${linksHtml(dp.links)}
  </div>`;
}

const trackById = id => TRACK.find(t => t.id === id);
function updRow(u) {
  const t = trackById(u.track) || { name: u.track };
  return `<div class="upd"><b>${esc(t.name)}</b><p>${esc(u.text)}</p>${linksHtml(u.links)}</div>`;
}

function subsec(title, hint, inner) {
  return inner ? `<div class="subsec"><h3>${title}${hint ? ` <small>${hint}</small>` : ''}</h3>${inner}</div>` : '';
}

/* ---------- 一期的內容（新格式） ---------- */
function v2Issue(r) {
  const items = (r.items || []).filter(it => passFilter(it, r));
  const head = items.filter(it => it.tier === 'headline');
  const main = items.filter(it => it.tier === 'main');
  const brief = items.filter(it => it.tier === 'brief');
  const deep = r.deep && (filter === 'all' || r.deep.domain === filter) ? r.deep : null;
  const upds = (r.tracking_updates || []).filter(u => {
    const t = trackById(u.track);
    return filter === 'all' || (t && t.domain === filter);
  });
  let html = '';
  html += subsec('本週值得知道', '重大變化，暫時用不上也收', head.length ? `<div class="items big">${head.map(it => v2Card(it, true)).join('')}</div>` : '');
  html += subsec('主文選讀', '先看兩句重點，需要再展開', main.length ? `<div class="items">${main.map(it => v2Card(it)).join('')}</div>` : '');
  html += subsec('一件事看深一點', '', deep ? deepBlock(deep) : '');
  html += subsec('追蹤有變化', '',upds.map(updRow).join(''));
  html += subsec('短訊與限時資源', '免費插件、限時領取、活動與小消息', brief.length ? `<ul class="brief-list">${brief.map(briefRow).join('')}</ul>` : '');
  if (!html) html = '<p class="empty">這個領域本期沒有內容。</p>';
  if (filter === 'all' && r.note) {
    const n = r.note;
    html += `<div class="note">
      ${n.topline ? `<p><b>本期說明</b> · ${esc(n.topline)}</p>` : ''}
      ${n.searched ? `<p><b>搜了什麼</b> · ${esc(n.searched)}</p>` : ''}
      ${n.skipped ? `<p><b>沒收什麼與原因</b> · ${esc(n.skipped)}</p>` : ''}
    </div>`;
  }
  if ((r.corrections || []).length) {
    html += `<div class="corr"><b>更正紀錄</b>${r.corrections.map(c => `<p>${esc(c.date)} · ${esc(c.text)}</p>`).join('')}</div>`;
  }
  return html;
}

/* ---------- 一期的內容（改版前格式） ---------- */
const SUM_CLAMP = 160;
function legacyCard(it) {
  const long = (it.summary || '').length > SUM_CLAMP;
  return `<article class="item">
    ${starBtn(it.title)}
    <div class="tags">${(it.domains || []).map(legacyTag).join('')}</div>
    <h4>${esc(it.title)}</h4>
    <p class="sum${long ? ' clamped' : ''}">${esc(it.summary)}</p>
    ${long ? '<button class="more" data-clamp>展開全文 ▾</button>' : ''}
    <div class="use"><b>對你的用法</b> · ${esc(it.use)}</div>
    ${linksHtml(it.links)}
  </article>`;
}
function legacyIssue(r) {
  const items = (r.items || []).filter(it => passFilter(it, r));
  let html = '<p class="legacy-note">這一期是改版前「AI 應用雷達」的格式，領域標籤沿用舊分類。</p>';
  html += items.length ? `<div class="items">${items.map(legacyCard).join('')}</div>` : '<p class="empty">這個領域本期沒有內容。</p>';
  if (filter === 'all' && r.analysis) {
    const a = r.analysis;
    html += `<div class="analysis"><h4>本期分析與總結</h4><p class="topline">${esc(a.topline)}</p>` +
      (a.verdicts || []).map(v => {
        const l = LV[v.level] || LV.try;
        return `<div class="verdict"><span class="lv" style="background:${l.c}">${l.t}</span><b>${esc(v.item)}</b>
          <p>${esc(v.reason)}</p><div class="practice"><b>實務</b> · ${esc(v.practice)}</div></div>`;
      }).join('') + (a.meta ? `<p class="meta-note">${esc(a.meta)}</p>` : '') + '</div>';
  }
  if ((r.corrections || []).length) {
    html += `<div class="corr"><b>更正紀錄</b>${r.corrections.map(c => `<p>${esc(c.date)} · ${esc(c.text)}</p>`).join('')}</div>`;
  }
  return html;
}
const issueHtml = r => isV2(r) ? v2Issue(r) : legacyIssue(r);
const issueCount = r => {
  const n = (r.items || []).filter(it => passFilter(it, r)).length;
  return n + (isV2(r) && r.deep && (filter === 'all' || r.deep.domain === filter) ? 1 : 0);
};

/* ---------- 各區塊 ---------- */
function renderBar() {
  const bar = document.getElementById('filterBar');
  const chip = (key, name, color) => {
    const on = filter === key;
    return `<button class="chip${on ? ' active' : ''}" data-filter="${key}" style="${on ? `background:${color}` : ''}">${esc(name)}</button>`;
  };
  bar.innerHTML = chip('all', '全部', 'var(--text)') + DOMAINS.map(d => chip(d.key, d.name, d.color)).join('');
}

function renderLatest() {
  const meta = document.getElementById('latestMeta');
  const body = document.getElementById('latestBody');
  if (!REPORTS.length) { meta.innerHTML = ''; body.innerHTML = '<p class="empty">尚無資料。</p>'; return; }
  const r = REPORTS[0];
  const range = r.range ? ` · 搜尋區間 ${esc(r.range.from)} 至 ${esc(r.range.to)}` : '';
  meta.innerHTML = `<span class="badge">第 ${issueNo(r)} 期</span><span>${esc(r.week)}${range}</span>`;
  body.innerHTML = issueHtml(r);
}

function renderArchive() {
  const list = document.getElementById('archiveList');
  const older = REPORTS.slice(1);
  const html = older.map(r => {
    const n = issueCount(r);
    if (!n && filter !== 'all') return '';
    const open = openWeeks.has(r.week);
    return `<div class="report${open ? ' open' : ''}">
      <button class="report-head" data-week="${esc(r.week)}"><span class="caret">▶</span>
        <span class="badge">第 ${issueNo(r)} 期</span><span>${esc(r.week)}</span><span>· ${n} 則</span>
        ${isV2(r) ? '' : '<span class="etag">舊格式</span>'}</button>
      <div class="report-body">${open ? issueHtml(r) : ''}</div>
    </div>`;
  }).join('');
  list.innerHTML = html || '<p class="empty">這個領域的舊期沒有內容。</p>';
}

function renderResults() {
  const sec = document.getElementById('results');
  const on = !!query;
  sec.hidden = !on;
  ['latest', 'archive'].forEach(id => { document.getElementById(id).hidden = on; });
  if (!on) return;
  let total = 0;
  const groups = REPORTS.map(r => {
    const hits = (r.items || []).filter(it => passFilter(it, r) && passQuery(it));
    total += hits.length;
    if (!hits.length) return '';
    const cards = hits.map(it => isV2(r) ? (it.tier === 'brief' ? `<ul class="brief-list">${briefRow(it)}</ul>` : v2Card(it)) : legacyCard(it)).join('');
    return `<div class="result-group"><p>第 ${issueNo(r)} 期 · ${esc(r.week)}</p><div class="items">${cards}</div></div>`;
  }).join('');
  document.getElementById('resultNote').textContent = `「${query}」共 ${total} 則`;
  document.getElementById('resultList').innerHTML = groups || '<p class="empty">找不到符合的內容。</p>';
}

function renderSaved() {
  const ul = document.getElementById('savedList');
  if (!saved.length) { ul.innerHTML = '<li class="empty" style="border:none;background:none">還沒有收藏。在卡片右上點 ☆ 即可加入。</li>'; return; }
  ul.innerHTML = saved.map(id => `<li><span>${esc(id)}</span><button class="rm" data-unsave="${esc(id)}" title="移除">✕</button></li>`).join('');
}

function renderWatch() {
  const rules = CFG.rules || [];
  document.getElementById('rulesBox').innerHTML = `<b>選材規則</b><ul>${rules.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const shown = DOMAINS.filter(d => filter === 'all' || filter === d.key);
  document.getElementById('watchList').innerHTML = shown.map(d => `
    <details class="watch" style="--dc:${d.color}"${filter === d.key ? ' open' : ''}>
      <summary><span class="dot" style="background:${d.color}"></span>${esc(d.name)}<small>${esc(d.freq)}</small></summary>
      <div class="watch-body">
        <p>${esc(d.scope)}</p>
        <ul>${(d.watch || []).map(w => `<li>${esc(w)}</li>`).join('')}</ul>
      </div>
    </details>`).join('');
}

function render() {
  renderBar(); renderResults(); renderLatest(); renderArchive(); renderSaved(); renderWatch();
}

/* ---------- 互動 ---------- */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f) { const k = f.dataset.filter; filter = (filter === k || k === 'all') ? 'all' : k; render(); return; }
  const s = e.target.closest('[data-star]');
  if (s) { const id = s.dataset.star; saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; persist(); render(); return; }
  const u = e.target.closest('[data-unsave]');
  if (u) { saved = saved.filter(x => x !== u.dataset.unsave); persist(); render(); return; }
  const t = e.target.closest('[data-toggle]');
  if (t) { const box = t.closest('.item'); const on = box.classList.toggle('expanded'); t.textContent = on ? '收合 ▴' : '展開全文 ▾'; return; }
  const c = e.target.closest('[data-clamp]');
  if (c) { const p = c.closest('.item').querySelector('.sum'); const cl = p.classList.toggle('clamped'); c.textContent = cl ? '展開全文 ▾' : '收合 ▴'; return; }
  const dp = e.target.closest('[data-deep]');
  if (dp) { const b = dp.closest('.deep').querySelector('.body'); const cl = b.classList.toggle('clamped'); dp.textContent = cl ? '展開全文 ▾' : '收合 ▴'; return; }
  const w = e.target.closest('[data-week]');
  if (w) { const k = w.dataset.week; openWeeks.has(k) ? openWeeks.delete(k) : openWeeks.add(k); renderArchive(); }
});
let qTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 180);
});

render();
</script>
</body>
</html>
